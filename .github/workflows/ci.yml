name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: renquant-model
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-common
          path: renquant-common
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-base-data
          path: renquant-base-data
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-artifacts
          path: renquant-artifacts
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-pipeline
          path: renquant-pipeline
      # renquant-orchestrator is NOT a factory dependency; the ensemble
      # Phase-0 G4 forward-consumer + PIT parity ledger (experiments/,
      # research-only) import its import-light step-2 store/admission
      # modules on the pytest ``pythonpath`` (v4 §5 step 3). Checkout-only
      # (source on path) — deliberately NOT pip-installed, to avoid pulling
      # the orchestrator's runtime dependency tree into the model CI.
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-orchestrator
          path: renquant-orchestrator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python -m pip install -e renquant-common -e renquant-base-data -e renquant-artifacts -e renquant-pipeline -e "renquant-model[gbdt,patchtst]" pytest
      - name: Test
        working-directory: renquant-model
        run: make test
