name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: renquant-model
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-common
          path: renquant-common
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-base-data
          path: renquant-base-data
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-artifacts
          path: renquant-artifacts
      - uses: actions/checkout@v4
        with:
          repository: hallovorld/renquant-pipeline
          path: renquant-pipeline
      # renquant-orchestrator is deliberately NOT checked out here: the
      # model factory does not depend on the orchestrator, and adding a
      # model -> orchestrator edge would reverse the repo-boundary contract
      # (the orchestrator already depends on the model). The canonical G4
      # evidence store + admission ledger live in renquant-orchestrator and
      # are consumed by the UMBRELLA integration harness (RenQuant), not by
      # any model-repo module. What stays in the model is the portable,
      # data-contract-only PIT input-parity comparator.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python -m pip install -e renquant-common -e renquant-base-data -e renquant-artifacts -e renquant-pipeline -e "renquant-model[gbdt,patchtst]" pytest
      - name: Test
        working-directory: renquant-model
        run: make test
