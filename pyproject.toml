[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renquant-model"
version = "0.2.0"
description = "RenQuant model families (GBDT panel-LTR + PatchTST sequence) in one repo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # >=0.8.1: renquant_common.model_fingerprint (unified model_content_sha256
  # — 2026-07-01 fix for the recurring calibrator/scorer fingerprint-mismatch
  # fail-closed, 05-27/06-22/07-01). Structural dependency, not just a
  # version-range bump: below 0.8.1 this module does not exist.
  # >=0.12.0: renquant_common.cost_model (crypto RFC D-C8a, common#28) —
  # HARD dependency of the renquant_model_crypto fee gate (D-C8b). No local
  # fallback exists by design (Codex review, model#43 r2): the crypto family
  # fails closed at import below this version.
  "renquant-common>=0.15.1,<1.0",
  "renquant-base-data>=0.1.0",
  "renquant-artifacts>=0.1.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  # Real NYSE session calendar (holidays + early closes) for the ensemble
  # Phase 0 admissibility ledger's decision-schedule resolution
  # (experiments/ensemble_phase0/admissibility_ledger.py) -- the SAME
  # exchange-calendar primitive renquant-execution/renquant-orchestrator use.
  "pandas_market_calendars>=4",
]

# Per-family optional extras keep installs slim:
#   pip install renquant-model[gbdt]      → XGBoost backend
#   pip install renquant-model[alpha158-linear]  → sklearn linear backend
#   pip install renquant-model[patchtst]         → torch + transformers backend
[project.optional-dependencies]
gbdt = ["xgboost>=2.1", "pyarrow>=15", "scikit-learn>=1.4"]
alpha158-linear = ["pyarrow>=15", "scikit-learn>=1.4"]
patchtst = ["torch>=2.2", "transformers>=4.40"]
sentiment = ["torch>=2.2", "transformers>=4.40", "pyarrow>=15"]

[project.scripts]
rq-gbdt-wf-retrain-readiness = "renquant_model_gbdt.wf_retrain_readiness:main"

# Scorer entry points — consumers reach these only via
# renquant_common.load_scorer (RFC §"Cross-Repo Contracts → Scorer Protocol").
[project.entry-points."renquant_common.scorers"]
panel_ltr_xgboost = "renquant_model_gbdt.scorer:load"
panel_linear = "renquant_model_alpha158_linear.scorer:load"
patchtst_panel = "renquant_model_patchtst.scorer:load"
# Alias: matches sidecars stamped with kind="hf_patchtst" (the arch name) so
# load_scorer dispatches identically whether the manifest names the family or
# the runtime adapter.
hf_patchtst = "renquant_model_patchtst.scorer:load"
# PR #17 review (cross-repo blocker): PatchTSMixer sidecars stamped with
# kind="hf_patchtsmixer" must dispatch through the same scorer:load entry,
# which internally branches on the checkpoint's `kind` field to reconstruct
# either HFPatchTSTRanker or HFPatchTSMixerRanker. Without this alias,
# renquant_common.load_scorer(manifest.kind="hf_patchtsmixer") would raise
# ScorerKindNotRegistered before scorer.load() can inspect the checkpoint.
hf_patchtsmixer = "renquant_model_patchtst.scorer:load"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# renquant-orchestrator is intentionally absent from the pytest pythonpath:
# the model factory must not import the orchestrator (that would reverse the
# repo-boundary contract — the orchestrator depends on the model, not the
# other way round). The ensemble_phase0 PIT input-parity comparator is
# model-only and operates on plain decision-record mappings; the canonical
# G4 evidence store + admission ledger (renquant_orchestrator.g4_shadow_job /
# g4_admission) are consumed by the umbrella integration harness (RenQuant),
# never by a model-repo module or its tests.
pythonpath = ["src", "../renquant-common/src", "../renquant-base-data/src", "../renquant-artifacts/src", "../renquant-pipeline/src"]
testpaths = ["tests"]
